<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korvath the Barbarian — Episode 2 Full Motion Comic Movie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700;900&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070709;
      --card: #0f1015;
      --border: #2a2015;
      --blood-gold: #fca311;
      --crimson: #e63946;
      --text: #eae2d6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cinzel', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 80px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 34px;
      letter-spacing: 3px;
      color: var(--blood-gold);
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(252, 163, 17, 0.4);
    }
    .sub {
      color: var(--crimson);
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 4px;
    }
    .player-container {
      max-width: 1100px;
      width: 100%;
      background: #000;
      border: 3px solid #1a1a24;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.95);
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000;
    }
    .meta-bar {
      background: #111218;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #222;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge {
      background: #2a1a14;
      color: var(--blood-gold);
      border: 1px solid var(--blood-gold);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: bold;
    }
    .cast-credits {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #aaa;
      flex-wrap: wrap;
    }
    .cast-credits strong {
      color: var(--blood-gold);
    }
    .content-grid {
      max-width: 1100px;
      width: 100%;
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .card h2 {
      font-size: 18px;
      color: var(--blood-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .chapter-btn {
      background: #161720;
      border: 1px solid #2a2015;
      color: #ccc;
      padding: 10px 14px;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .chapter-btn:hover {
      background: #2a1c13;
      color: #fff;
      border-color: var(--blood-gold);
      transform: translateX(2px);
    }
    .chapter-num {
      color: var(--crimson);
      font-weight: bold;
      margin-right: 6px;
    }
    .back-nav {
      margin-top: 32px;
    }
    .back-btn {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      border: 1px solid #333;
      padding: 10px 20px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: var(--blood-gold);
      border-color: var(--blood-gold);
    }
  </style>
</head>
<body>
  <header>
    <h1>Korvath the Barbarian</h1>
    <div class="sub">Episode 2: The Blood-Thieves of Valkash — Full Motion Comic Movie</div>
  </header>

  <main class="player-container">
    <video id="player" controls playsinline poster="./assets/ep2/panel_01.webp">
      <source src="./episode_02_motion_comic.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="meta-bar">
      <span class="badge" id="video-badge">FULL 20-PANEL CINEMATIC MOVIE</span>
      <div class="cast-credits">
        <span><strong>Chronicler:</strong> British Neural</span>
        <span><strong>Korvath:</strong> Northern Guttural</span>
        <span><strong>Natari:</strong> Desert Rogue</span>
        <span><strong>Lord Malakor:</strong> Oily Merchant</span>
      </div>
    </div>
  </main>

  <div style="margin: 20px 0 0; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 1100px;">
    <button onclick="switchVideo('./episode_02_motion_comic.mp4', 'FULL 20-PANEL MOVIE')" class="chapter-btn" style="background:#201712; border: 1px solid #fca311; color:#fca311; font-weight:bold; padding:12px 20px; font-size:13px; cursor:pointer;">
      🎬 Play Full 20-Panel Movie (3.4 min)
    </button>
    <button onclick="switchVideo('./panel_10_elevenlabs_trial.mp4', '🔥 ELEVENLABS TRIAL (PANEL 10 SCREAM)')" class="chapter-btn" style="background:#3d1118; border: 1px solid #e63946; color:#ffdddd; font-weight:bold; padding:12px 20px; font-size:13px; cursor:pointer;">
      🔥 Play ElevenLabs Screaming Trial (Panel 10)
    </button>
  </div>

  <section class="content-grid">
    <div class="card">
      <h2>Scene Selection & Beats</h2>
      <div class="chapters-grid" id="chapters-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

  <div class="back-nav">
    <a href="./index.html#issue-2" class="back-btn">← Back to Graphic Novel Web Reader</a>
  </div>

  <script>
    // Chapter timestamps will be populated by the build script
    fetch('./episode_02_chapters.json')
      .then(r => r.json())
      .then(chapters => {
        const container = document.getElementById('chapters-list');
        chapters.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'chapter-btn';
          const time = (c.timestamp !== undefined) ? c.timestamp : (c.startTime || 0);
          const timeStr = c.formattedTime || formatTime(time);
          btn.innerHTML = '<span><span class="chapter-num">P' + c.panelId + '</span> ' + c.title + '</span><span style="color:#fca311;font-size:11px;font-weight:bold;">' + timeStr + '</span>';
          btn.onclick = () => {
            const player = document.getElementById('player');
            player.currentTime = time;
            player.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
          container.appendChild(btn);
        });
      })
      .catch(() => {});

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function switchVideo(src, badgeText) {
      const player = document.getElementById('player');
      player.src = src;
      player.load();
      player.play();
      if (badgeText) {
        document.getElementById('video-badge').textContent = badgeText;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
